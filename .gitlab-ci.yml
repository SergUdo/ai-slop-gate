stages:
  - ai_slop_gate_static
  - ai_slop_gate_llm
  - ai_slop_gate_full

variables:
  DOCKER_IMAGE: "ghcr.io/sergiudo/ai-slop-gate:latest"
  WORKSPACE: "/workspace"

# -----------------------------
# STATIC ANALYSIS JOB
# -----------------------------
ai_slop_gate_static:
  stage: ai_slop_gate_static
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Running AI Slop Gate (static providers only)"
    - docker run --rm \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --policy "$WORKSPACE/policy.yml" \
          --provider static \
          --fail-on blocking
  allow_failure: false

# -----------------------------
# LLM ANALYSIS JOB
# -----------------------------
ai_slop_gate_llm:
  stage: ai_slop_gate_llm
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Running AI Slop Gate (LLM providers)"
    - docker run --rm \
        -e OPENAI_API_KEY="$OPENAI_API_KEY" \
        -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
        -e GEMINI_API_KEY="$GEMINI_API_KEY" \
        -e AZURE_OPENAI_KEY="$AZURE_OPENAI_KEY" \
        -e GROQ_API_KEY="$GROQ_API_KEY" \
        -e COPILOT_API_KEY="$COPILOT_API_KEY" \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --policy "$WORKSPACE/policy.yml" \
          --provider llm \
          --fail-on blocking
  rules:
    - if: '$OPENAI_API_KEY || $ANTHROPIC_API_KEY || $GEMINI_API_KEY || $AZURE_OPENAI_KEY || $GROQ_API_KEY || $COPILOT_API_KEY'
      when: on_success
    - when: never
  allow_failure: false

# -----------------------------
# FULL ANALYSIS JOB (static + llm)
# -----------------------------
ai_slop_gate_full:
  stage: ai_slop_gate_full
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Running AI Slop Gate (full providers)"
    - docker run --rm \
        -e OPENAI_API_KEY="$OPENAI_API_KEY" \
        -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
        -e GEMINI_API_KEY="$GEMINI_API_KEY" \
        -e AZURE_OPENAI_KEY="$AZURE_OPENAI_KEY" \
        -e GROQ_API_KEY="$GROQ_API_KEY" \
        -e COPILOT_API_KEY="$COPILOT_API_KEY" \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --policy "$WORKSPACE/policy.yml" \
          --provider all \
          --fail-on blocking
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  allow_failure: false
