version: "v1.4"
project_name: "ai_slop_gate"

# Limit static analysis ONLY to mounted repository code
include_paths:
  - .

# ============================================================================
# EXCLUSIONS - Based on test results showing 68/257 findings are noise
# ============================================================================
exclude_paths:
  # Build artifacts (removed 189 findings)
  - "docs/_build/**"
  - "docs/_static/**"
  - "build/**"
  - "dist/**"
  
  # Cache (removes 7 findings)
  - ".ai-slop-cache/**"
  
  # Dependencies
  - "node_modules/**"
  - "vendor/**"
  - ".bundle/**"
  - ".venv/**"
  - "venv/**"
  - "__pycache__/**"
  - "*.egg-info/**"

# Files with intentional example/test secrets (removes 21 findings)
exclude_secret_files:
  - ".env"  # Example configuration
  - ".env.example"
  - "**/.env.example"
  - "**/test_*.py"  # Test scripts with mock tokens
  - "**/verify_*.sh"  # Verification scripts
  - "**/setup_*.sh"  # Setup scripts
  - "README.md"  # Documentation examples
  - "docs/**/*.md"  # All documentation
  - "**/example_*.yml"  # Example workflows
  - "**/example_*.md"  # Example reports
  - "package-lock.json"  # npm dependencies

# Whitelisted domains for GDPR checks (removes 173+ warnings)
allowed_external_domains:
  - "registry.npmjs.org"  # npm registry
  - "github.com"
  - "githubusercontent.com"
  - "readthedocs.org"
  - "readthedocs.io"
  - "pypi.org"
  - "python.org"
  - "jsdelivr.net"

# ============================================================================
# ORIGINAL CONFIGURATION - All enforcement rules preserved
# ============================================================================

# Global enforcement level: never | advisory | blocking
enforcement: blocking 

# --- AI Provider configuration ---
ai_provider:
  name: gemini
  model: gemini-2.5-flash
  models: 
    gemini: gemini-2.5-flash
    groq: llama-3.3-70b-versatile 
    groq_native: gemma-2-9b 
    local: llama3.1:8b 
    ollama: qwen2.5-coder:1.5b
  default_provider: gemini
  temperature: 0.1
  mode: blocking 
  explain: false 
  cache: true 
  block_in_pr: true
  region: US

# --- Compliance Module (Deterministic Sidecar) ---
compliance:
  enabled: true 
  run_in_pr: true

  data_residency_mode: advisory

  license_audit:
    enabled: true
    forbidden_licenses:
      - GPL-2.0
      - GPL-3.0
      - AGPL-3.0
    severity: high
    tags: [license, supply-chain, legal]
 
  security_audit:
    enabled: true
    external_scanners: [trivy]
    detect_secrets: true
    detect_pii: true
    detect_suspicious_todos: true
    detect_gdpr: true
    detect_non_eu_endpoints: true
    enforce_data_residency: EU
    severity: critical
    tags: [security, gdpr, residency]

  gdpr_detection:
    enabled: true
    severity_email: medium
    severity_ssn: high
    severity_todo: medium
    severity_non_eu_endpoint: medium

# --- AI Slop Detection Logic (LLM Context) ---
ai_slop:
  max_redundancy: 3
  max_length: 50
 
  detect_llm_quality:
    enabled: true
    explain: true
    severity: medium
    tags: [ai, quality]
    prompt_template: |
      Analyze the code for AI slop, unidiomatic patterns, or inefficiency.
      Focus on identifying repetitive code and generic AI-generated comments.
      Code: {code_snippet}
 
  detect_hallucinations:
    enabled: true
    severity: high
    tags: [ai, hallucination]
    prompt_template: |
      Check the following code for hallucinations or logic inaccuracies.
      Verify if comments match the actual implementation.
      Code: {code_snippet}

# --- Static Code Quality Analysis ---
code_quality:
  detect_todo: true
  detect_fixme: true
  max_function_length: 50
  severity: low
  tags: [quality, maintainability]

  javascript:
    max_function_length: 50
    severity: low

  python:
    max_function_length: 50
    severity: low

# --- Infrastructure as Code (IaC) Security ---
infrastructure_security:
  dockerfile:
    check_user: true
    severity: high
    tags: [docker, security]

  kubernetes:
    check_root_user: true
    check_privileged: true
    severity: critical
    tags: [k8s, security]

  terraform:
    check_public_access: true
    severity: high
    tags: [terraform, cloud, security]

# --- Rules Engine Logic ---
rules:
  - id: static-failsafe-block
    when:
      severity: failure
    then:
      action: blocking
      message: "Security failure detected by static pipeline."

  - id: block-llm-failure-in-pr
    when:
      severity: failure
    then:
      action: blocking
      message: "LLM failure detected in PR"

  - id: block-llm-failure
    when:
      severity: failure
    then:
      action: blocking
      message: "LLM detected a failure-level issue"

  - id: block-critical-compliance-violations
    when:
      severity: ["critical"]
    then:
      action: blocking
      message: "Critical compliance violation"

  - id: block-llm-failures
    when:
      level: ["failure"]
    then:
      action: blocking
      message: "LLM failure detected"

  - id: block-ai-slop-related-signals
    when:
      signal: "slop|nonsensical|contradictory|ai_generated|meaningless|chaos|unreviewed|bad_practice|insecure_base_image_recommendation|vulnerable_base_image_recommendation|overwrite_built_artifacts|debug_tools_in_production_image|remote_ssh_server_recommendation"
    then:
      action: blocking
      message: "AI Slop detected"

  - id: block-hardcoded-secrets-static
    when:
      signal: "hardcoded_api_key|hardcoded_sensitive_data|hardcoded_root_credentials|hardcoded_root_password_mysql|gdpr_data_exfiltration|sql_injection_vulnerability"
    then:
      action: blocking
      message: "Hardcoded secrets or dangerous data flows"

  - id: block-too-many-findings
    when:
      count_greater_than: 10
    then:
      action: blocking
      message: "Too many issues detected"

  - id: hardcoded-secret-block
    when:
      signal: hardcoded_secret
      severity: high
    then:
      action: blocking
      message: "Hardcoded secret detected. Merge prohibited."

  - id: block-hardcoded-secrets
    when:
      signal: "hardcoded_.*"
    then:
      action: blocking
      message: "Hardcoded secret detected. Merge prohibited."

  - id: block-api-token-in-header
    when:
      signal: api_token_in_fetch_header
    then:
      action: blocking
      message: "API token exposed in Authorization header."

  - id: global-blocking-high-severity
    when:
      severity: high
      min_confidence: 0.8
    then:
      action: blocking
      message: "Blocking: High-severity issue with strong confidence."

  - id: license-violation-block
    when:
      category: license
      severity: high
    then:
      action: blocking
      message: "Forbidden license detected."

  - id: ai-slop-advisory
    when:
      category: quality
      severity: medium
    then:
      action: advisory
      message: "AI Slop detected: Code quality could be improved."

  - id: maintenance-notice
    when:
      signal: "negative"
    then:
      action: advisory
      severity: low
      message: "Technical debt: Please address placeholders."
