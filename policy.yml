version: "v1"
project_name: "ai_slop_gate"

enforcement: advisory

# --- AI Provider configuration ---
ai_provider:
  name: gemini
  model: gemini-2.5-flash
  temperature: 0.1
  mode: advisory

# --- Compliance Module (Stage 0.6 canonical) ---
compliance:
  enabled: false          # overridden by --compliance
  profiles: []
  license:
    forbid: []
    allow: []
  enforcement: advisory

# --- AI Slop Detection Logic ---
ai_slop:
  max_redundancy: 3
  max_length: 50

  detect_llm_quality:
    enabled: true
    prompt_template: |
      Analyze the following code snippet for potential AI slop...

  detect_style_violations:
    enabled: true
    prompt_template: |
      Does the following code adhere to best practices...

  detect_hallucinations:
    enabled: true
    prompt_template: |
      Check the following code and comments for potential hallucinations...

# --- Static Analysis ---
code_quality:
  detect_todo: true
  detect_fixme: true
  max_function_length: 50

infrastructure_security:
  dockerfile:
    check_user: true
    check_sensitive_env: true
  kubernetes:
    check_root_user: true
    check_privileged: true
  terraform:
    check_public_access: true

# --- Rules Engine ---
rules:
  - id: hardcoded-secret
    when:
      category: security
      signal: negative
      min_confidence: 0.9
    then:
      decision: block
      reason: "Hardcoded secret detected"

  - id: TF_PUBLIC_ACCESS
    when:
      category: TERRAFORM
      signal: INSECURE_CONFIG
      min_confidence: 0.95
    then:
      decision: block
      reason: "Terraform plan exposes resource to public access (0.0.0.0/0)"

  - id: TF_MISSING_TAGS
    when:
      category: TERRAFORM
      signal: MISSING_TAGS
    then:
      decision: advisory
      reason: "Terraform resource is missing mandatory tags"

  - id: k8s-no-root
    when:
      category: security
      signal: RUN_AS_ROOT
    then:
      decision: block
      reason: "Kubernetes container must not run as root"

  - id: todo-advisory
    when:
      category: quality
      signal: negative
    then:
      decision: advisory
      reason: "Remove TODOs and FIXMEs before merging to main"
