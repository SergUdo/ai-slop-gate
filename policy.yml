version: "v1.3"
project_name: "ai_slop_gate"

# Global enforcement level: never | advisory | blocking
# Defines if the gate should fail the CI/CD pipeline
enforcement: blocking 

# --- AI Provider configuration ---
ai_provider:
  name: gemini                # Options: gemini | openai | groq | copilot
  model: gemini-2.5-flash
  temperature: 0.1
  mode: blocking              # AI observations can trigger a block
  explain: false              # Set true for detailed LLM reasoning
  cache: true                 # Enable to save tokens and improve speed

# --- Compliance Module (Deterministic Sidecar) ---
compliance:
  enabled: true               
  license_audit:
    enabled: true
    forbidden_licenses:
      - GPL-2.0
      - GPL-3.0
      - AGPL-3.0
    severity: high
    tags: [license, supply-chain, legal]
 
  security_audit:
    enabled: true
    detect_secrets: true
    enforce_data_residency: EU
    severity: critical
    tags: [security, gdpr, residency]

# --- AI Slop Detection Logic (LLM Context) ---
ai_slop:
  max_redundancy: 3
  max_length: 50
 
  detect_llm_quality:
    enabled: true
    explain: true
    severity: medium
    tags: [ai, quality]
    prompt_template: |
      Analyze the code for AI slop, unidiomatic patterns, or inefficiency.
      Focus on identifying repetitive code and generic AI-generated comments.
      Code: {code_snippet}
 
  detect_hallucinations:
    enabled: true
    severity: high
    tags: [ai, hallucination]
    prompt_template: |
      Check the following code for hallucinations or logic inaccuracies.
      Verify if comments match the actual implementation.
      Code: {code_snippet}

# --- Static Code Quality Analysis ---
code_quality:
  detect_todo: true
  detect_fixme: true
  max_function_length: 50
  severity: low
  tags: [quality, maintainability]

  javascript:
    max_function_length: 50
    severity: low

  python:
    max_function_length: 50
    severity: low

# --- Infrastructure as Code (IaC) Security ---
infrastructure_security:
  dockerfile:
    check_user: true          # Ensure root is not used in Docker
    severity: high
    tags: [docker, security]

  kubernetes:
    check_root_user: true     # Validate securityContext settings
    check_privileged: true
    severity: critical
    tags: [k8s, security]

  terraform:
    check_public_access: true # Check for 0.0.0.0/0 in Security Groups
    severity: high
    tags: [terraform, cloud, security]

# --- Rules Engine Logic ---
rules:
  # 1. Critical Architecture & Security Blockers
  - id: global-blocking-high-severity
    when:
      severity: high          # Covers 'high' and 'critical'
      min_confidence: 0.8
    then:
      action: blocking
      message: "Blocking: Critical issue detected with high confidence. Manual review required."

  - id: static-security-block
    when:
      category: quality
      signal: no-undef
    then:
      action: blocking
      message: "Undefined variable detected by static analysis. Possible runtime error."

  - id: k8s-infrastructure-mismatch
    when:
      category: architecture
      signal: ".*_mismatch"   # Catch all port, version, or target mismatches
    then:
      action: blocking
      message: "Infrastructure mismatch: Potential service failure in production."

  - id: k8s-port-mismatch
    when:
      category: architecture
      signal: service_targetport_mismatch # Exact string match
      min_confidence: 0.8
    then:
      action: blocking
      message: "Port mismatch detected."

  - id: k8s-version-mismatch
    when:
      category: architecture
      signal: service_deployment_version_mismatch # Exact string match
    then:
      action: blocking
      message: "Version mismatch detected."

  - id: k8s-namespace-mismatch
    when:
      category: architecture
      signal: ".*_mismatch"   # Catch all port, version, or target mismatches
    then:
      action: blocking
      message: "Namespace mismatch: Potential service failure in production."

  - id: security-policy-violation
    when:
      category: security
    then:
      action: blocking
      message: "Security Policy Violation: Merging is prohibited."

  - id: security-violation
    when:
      category: security
    then:
      action: blocking
      severity: critical
      message: "Security Policy Violation: Merging is prohibited."

  # 2. Advisory Rules (Informational)
  - id: ai-slop-advisory
    when:
      category: quality
      severity: medium
    then:
      action: advisory
      message: "AI Slop detected: Code quality could be improved, but not blocking."

  - id: maintenance-notice
    when:
      signal: "negative"      # Matches TODOs/FIXMEs
    then:
      action: advisory
      severity: low
      message: "Technical debt: Please address placeholders before closing this PR."
