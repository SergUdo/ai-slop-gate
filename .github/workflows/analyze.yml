name: Full CI - ESLint + ai-slop-gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [static, eslint, terraform-plan, k8s-runtime]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node.js for ESLint ---
      - name: Setup Node.js
        if: matrix.provider == 'eslint'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        if: matrix.provider == 'eslint'
        run: npm install

      - name: Run ESLint
        if: matrix.provider == 'eslint'
        run: npm run lint

      # --- Python environment ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # --- Prepare test K8s manifests ---
      - name: Create K8s test manifests
        if: matrix.provider == 'k8s-runtime'
        run: mkdir -p ai_slop_gate/fixtures && echo "{}" > ai_slop_gate/fixtures/k8s_test.yaml

      # --- Run ai-slop-gate ---
      - name: Run ai-slop-gate analysis
        env:
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> Running provider: ${{ matrix.provider }}"
          python -m ai_slop_gate.cli.main run \
            --policy policy.yml \
            --provider ${{ matrix.provider }} \
            --enforcement advisory \
            $(if [ "${{ matrix.provider }}" == "k8s-runtime" ]; then echo "--k8s-manifests ai_slop_gate/fixtures/k8s_test.yaml"; fi) \
            --github-checks \
            --github-repo ${{ github.repository }} \
            --github-sha ${{ github.sha }}
