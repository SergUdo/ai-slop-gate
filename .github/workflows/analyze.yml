name: Analyze PR with ESLint and ai-slop-gate

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Node.js for ESLint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      # --- Setup Python for ai-slop-gate ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # --- Run ai-slop-gate analysis with GitHub Checks ---
      - name: Run ai-slop-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
        run: |
          python -m ai_slop_gate.cli.main run \
            --provider static \
            --policy policy.yml \
            --enforcement advisory \
            --github-checks \
            --github-repo ${{ github.repository }} \
            --github-sha ${{ github.sha }}
