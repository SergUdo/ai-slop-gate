name: AI Slop Gate Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh  \
            | sh -s -- -b . v0.69.2 ./trivy image --severity HIGH,CRITICAL ai-slop-gate:latest

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Static Analysis
        run: |
          python -m ai_slop_gate.cli run \
            --provider static_pipeline \
            --policy policy.yml \
            --path . \
            --enforcement advisory

  llm-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Cache LLM responses
        uses: actions/cache@v3
        with:
          path: .ai-slop-cache
          key: llm-cache-${{ hashFiles('**/*.py', '**/*.js') }}
          restore-keys: llm-cache-

      - name: Run Groq Analysis
        env:
          GROQ_API_KEY: ${{ secrets.SLOPE_GATE_GROQ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --provider groq \
            --llm-local \
            --github-repo ${{ github.repository }} \
            --pr-id ${{ github.event.pull_request.number }} \
            --policy policy.yml \
            --path . \
            --enforcement advisory

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.50.4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Compliance Check
        run: |
          python -m ai_slop_gate.cli run \
            --compliance \
            --policy policy.yml \
            --path ai_slop_gate \
            --enforcement advisory
            