name: Analyze PR with ESLint and ai-slop-gate

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Node.js environment for ESLint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache removed because package-lock.json is gitignored

      - name: Install JS dependencies
        # Using 'npm install' as 'npm ci' requires a lockfile
        run: npm install

      - name: Run ESLint
        # This will only fail on actual errors, not warnings
        run: npm run lint

      # --- Setup Python environment for ai-slop-gate ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run ai-slop-gate analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
        run: python -m ai_slop_gate.cli --policy policy.yml --advisory-only --enforcement advisory