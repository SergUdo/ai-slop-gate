name: AI Slop Gate Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # Fast static analysis (always runs)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-code folders from analysis
        run: |
          rm -rf docs
          rm -rf scripts
          rm -f policy.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run Static Analysis
        run: |
          python -m ai_slop_gate.cli run \
            --provider static_pipeline \
            --policy policy.yml \
            --path .

  # LLM analysis with cache (PR only)
  llm-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-code folders from analysis
        run: |
          rm -rf docs
          rm -rf scripts
          rm -f policy.yml
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Cache LLM responses
        uses: actions/cache@v3
        with:
          path: .ai-slop-cache
          key: llm-cache-${{ hashFiles('**/*.py', '**/*.js') }}
          restore-keys: llm-cache-
      
      - name: Run Groq Analysis
        env:
          GROQ_API_KEY: ${{ secrets.SLOPE_GATE_GROQ }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --provider groq \
            --llm-local \
            --github-repo ${{ github.repository }} \
            --policy policy.yml \
            --path .

  # Compliance check
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-code folders from analysis
        run: |
          rm -rf docs
          rm -rf scripts
          rm -f policy.yml
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install ai-slop-gate
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run Compliance Check
        run: |
          python -m ai_slop_gate.cli run \
            --compliance \
            --policy policy.yml \
            --path .
