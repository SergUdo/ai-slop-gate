name: Analyze PR with ESLint and ai-slop-gate

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Node.js environment for ESLint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint || true  # do not fail CI on warnings

      # --- Setup Python environment for ai-slop-gate ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Static Analysis Run
      - name: Run Static Analysis
        env:
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --policy policy.yml \
            --provider static \
            --enforcement advisory \
            --k8s-manifests ai_slop_gate/fixtures/k8s_test.yaml || echo "K8s fixture missing, continuing"

      # AI Analysis Run with Gemini
      - name: AI Slop Gate GitHub Check (Gemini)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --policy policy.yml \
            --provider gemini \
            --enforcement advisory \
            --github-checks \
            --github-repo ${{ github.repository }} \
            --github-sha ${{ github.sha }} \
            --k8s-manifests ai_slop_gate/fixtures/k8s_test.yaml || echo "Analysis failed or fixture missing, continuing"