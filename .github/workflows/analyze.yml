name: AI Slop Gate — Full Analysis

on:
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # Python environment
      # -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PyGithub
          pip install python-dotenv

      # -------------------------------
      # 1. Run Static Pipeline → save JSON
      # -------------------------------
      - name: Static Pipeline Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --policy policy.yml \
            --provider static_pipeline \
            --enforcement advisory \
            --base-path . \
            --output-file static_results.json

      # -------------------------------
      # 2. Run Groq Chunked → save JSON
      # -------------------------------
      - name: Groq Chunked Analysis
        env:
          SLOPE_GATE_GROQ: ${{ secrets.SLOPE_GATE_GROQ }}
        run: |
          python scripts/test_groq_provider.py > groq_results.json || true

      # -------------------------------
      # 3. Combine results
      # -------------------------------
      - name: Combine Static + Groq Results
        run: |
          python scripts/combine_results.py

      # -------------------------------
      # 4. Publish ONE GitHub Check
      # -------------------------------
      - name: Publish Combined Findings (GitHub Checks)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ai_slop_gate.cli publish \
            --github-checks \
            --github-repo ${{ github.repository }} \
            --github-sha ${{ github.sha }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pr-id ${{ github.event.pull_request.number }} \
            --input-file combined_results.json
