name: Analyze PR with ESLint and ai-slop-gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Node.js environment for ESLint ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint || true  # do not fail CI on warnings

      # --- Setup Python environment for ai-slop-gate ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PyGithub
          pip install google-generativeai
          

      # --- Run ai-slop-gate analysis ---
      - name: Run Static Analysis
        env:
          AI_SLOP_GATE_TOKEN: ${{ secrets.AI_SLOP_GATE_TOKEN }}
        run: |
          python -m ai_slop_gate.cli run \
            --policy policy.yml \
            --provider static \
            --enforcement advisory \
            --k8s-manifests ai_slop_gate/fixtures/k8s_test.yaml || echo "K8s fixture missing, continuing"

      # --- Run AI Analysis with Gemini ---
      - name: AI Slop Gate GitHub Check (Gemini)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m ai_slop_gate.cli run \
            --policy policy.yml \
            --provider gemini \
            --enforcement advisory \
            --github-checks \
            --github-repo ${{ github.repository }} \
            --github-sha ${{ github.sha }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pr-id ${{ github.event.pull_request.number }} \
            --input-file ai_slop_gate/fixtures/k8s_test.yaml || echo "AI Analysis failed, check logs"