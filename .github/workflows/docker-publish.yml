name: Build & Publish Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for uploading security scan results to GitHub Security tab
      security-events: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}

      # --- STEP 5: Security Scanning with Trivy ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJson(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      # --- STEP 6: SBOM Generation with Syft ---
      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJson(steps.meta.outputs.json).tags[0] }}
          format: "spdx-json"
          output-file: "sbom-spdx.json"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: "./sbom-spdx.json"

      # --- STEP 7: License Compliance Audit ---
      - name: Audit Licenses in SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'sbom'
          scan-ref: './sbom-spdx.json'
          format: 'table'
          exit-code: '1'
          scanners: 'license'
          severity: 'CRITICAL,HIGH'
      
       # --- STEP 8: Save image digest artifact ---
      - name: Save digest
        run: echo "${{ steps.build-push.outputs.digest }}" > digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: digest.txt
