name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Завантажуємо digest з основного workflow
      # -----------------------------
      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: image-digest

      - name: Read digest
        id: digest
        run: echo "digest=$(cat digest.txt)" >> $GITHUB_OUTPUT

      # -----------------------------
      # 2. Semantic Versioning (для назви релізу)
      # -----------------------------
      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -----------------------------
      # 3. Generate CHANGELOG
      # -----------------------------
      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # 4. Cosign signing (digest only)
      # -----------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "Signing digest: ${{ steps.digest.outputs.digest }}"
          cosign sign \
            --yes \
            --key env://COSIGN_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}

      # -----------------------------
      # 5. Create GitHub Release
      # -----------------------------
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
