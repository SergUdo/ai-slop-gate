name: Release

on:
  workflow_run:
    workflows: ["Build & Publish Docker Image"]
    types:
      - completed

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: image-digest
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read digest
        id: digest
        run: echo "digest=$(cat digest.txt)" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.event.workflow_run.head_branch }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "Signing digest: ${{ steps.digest.outputs.digest }}"
          cosign sign \
            --yes \
            --key env://COSIGN_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
