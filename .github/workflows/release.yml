name: Build, Version, Sign & Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 1. Semantic Versioning
      # -----------------------------
      - name: Determine next version
        id: semver
        uses: paulhatch/semantic-version@v4
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE)"
          minor_pattern: "(feat)"
          format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Create Git tag
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="v${{ steps.semver.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          git tag $VERSION
          git push origin $VERSION

      # -----------------------------
      # 2. Generate CHANGELOG
      # -----------------------------
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4
        with:
          mytoken: ${{ secrets.GITHUB_TOKEN }}

      - name: Save changelog
        run: echo "${{ steps.changelog.outputs.changelog }}" > CHANGELOG.md

      # -----------------------------
      # 3. Docker Buildx
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          provenance: false

      # -----------------------------
      # 4. Extract digest for signing
      # -----------------------------
      - name: Extract image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ env.VERSION }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # -----------------------------
      # 5. Cosign signing (digest only)
      # -----------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --yes \
            --key env://COSIGN_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}

      # -----------------------------
      # 6. Trivy scan
      # -----------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # -----------------------------
      # 7. SBOM
      # -----------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.digest }}
          format: "spdx-json"
          output-file: "sbom-spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: "./sbom-spdx.json"

      # -----------------------------
      # 9. Create GitHub Release
      # -----------------------------
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      # -----------------------------
      # 8. License audit
      # -----------------------------
      - name: Audit Licenses in SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'sbom'
          scan-ref: './sbom-spdx.json'
          format: 'table'
          exit-code: '1'
          scanners: 'license'
          severity: 'CRITICAL,HIGH'
