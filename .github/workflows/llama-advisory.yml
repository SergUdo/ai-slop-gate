name: Llama Advisory Check

# Trigger only on pull requests to main
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  ai-slop-gate:
    name: Run AI Slop Gate (Advisory Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npx tsc

      - name: Run ai-slop-gate
        env:
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          node dist/cli.js \
            --policy policy.yaml \
            --mode advisory \
            --provider llama
