[project]
name = "ai-slop-gate"
version = "0.1.0"
dependencies = [
    "pyyaml",
    "requests",
    "PyGithub",
    "python-dotenv",
    "google-generativeai",
    "groq"
]

[project.scripts]
ai-slop-gate = "ai_slop_gate.cli.main:main"

[tool.setuptools.packages.find]
include = ["ai_slop_gate*"]
exclude = ["node_modules*", "tests*", "docs*"]

[tool.setuptools.package-data]
ai_slop_gate = ["**/*.prompt"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]