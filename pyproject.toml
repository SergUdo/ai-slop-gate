[project]
name = "ai-slop-gate"
version = "0.1.0"
dependencies = [
    "pyyaml",
    "requests",
    "PyGithub"
    ]

[project.scripts]
ai-slop-gate = "ai_slop_gate.cli.main:main"

[tool.setuptools.packages.find]
include = ["ai_slop_gate*"]
exclude = ["node_modules*", "tests*", "docs*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
