include:
  - remote: 'https://raw.githubusercontent.com/sergudo/ai-slop-gate/main/ci/gate-template.yml'

variables:
  SLOP_PROVIDERS: "static" # Add "gemini" or "groq" to enable LLM analysis
  GEMINI_API_KEY: $GEMINI_API_KEY 
  AI_SLOP_GATE_TOKEN: $AI_SLOP_GATE_TOKEN

ai_slop_analysis:
  extends: .slop_gate_base
  stage: test
  before_script:
    - pip install google-genai
  rules:
    - if: $CI_MERGE_REQUEST_IID
