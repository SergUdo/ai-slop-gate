name: AI Slop Gate LLM Analysis

on:
  pull_request:
    branches: [ main ]
  # Allows manual triggering of the workflow from the Actions tab
  workflow_dispatch:

# Grant necessary permissions for the GitHub token to manage PR labels and comments
permissions:
  pull-requests: write
  contents: read

jobs:
  llm-analysis:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute the core analysis. 'continue-on-error' is set to true 
      # so we can perform post-analysis actions (like labeling) even if slop is detected.
      - name: Run AI Slop Gate (Gemini PR analysis)
        id: slop_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOPE_GATE_GROQ=: ${{ secrets.SLOPE_GATE_GROQ= }}
        continue-on-error: true
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e SLOPE_GATE_GROQ= \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run \
              --provider gemini \
              --policy policy.yml \
              --github-repo "${{ github.repository }}" \
              --pr-id "${{ github.event.pull_request.number }}"

      # Apply a visual indicator to the PR if the analysis fails the policy check
      - name: Label PR on Policy Violation
        if: steps.slop_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Define the label name as a string constant
          LABEL_NAME="slop-detected"
          
          # Create the label in the repository if it doesn't exist yet
          gh label create "$LABEL_NAME" \
            --color "ff0000" \
            --description "AI Slop detected by automated gate" \
            --repo ${{ github.repository }} || true
          
          # Assign the label to the current Pull Request
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "$LABEL_NAME" \
            --repo ${{ github.repository }}

      # Optional: Uncomment the following step if you prefer hard-blocking by closing the PR automatically.
      # - name: Close PR on Policy Violation
      #   if: steps.slop_gate.outcome == 'failure'
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh pr close ${{ github.event.pull_request.number }} \
      #       --comment "🚫 PR closed based on the AI Slop Gate analysis. Please review the feedback and improve the content before re-submitting." \
      #       --repo ${{ github.repository }}

      # Final step: If the AI Slop Gate returned a failure, we terminate the job with a non-zero exit code.
      # This ensures the PR shows a red "Failed" status in the GitHub UI, blocking the merge.
      - name: Fail workflow if slop detected
        if: steps.slop_gate.outcome == 'failure'
        run: |
          echo "Policy violation detected. Review the PR comments for details."
          exit 1