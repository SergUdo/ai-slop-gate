name: AI Slop Gate LLM Analysis

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Додаємо права для можливості закриття PR та запису коментарів
permissions:
  pull-requests: write
  contents: read

jobs:
  llm-analysis:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run AI Slop Gate (Gemini PR analysis)
        id: slop_gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GEMINI_API_KEY \
            ghcr.io/sergudo/ai-slop-gate:latest \
            run \
              --provider gemini \
              --policy policy.yml \
              --github-repo "${{ github.repository }}" \
              --pr-id "${{ github.event.pull_request.number }}"

      - name: Close PR on Policy Violation
        if: steps.slop_gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --comment "🚫 PR closed based on the AI Slop Gate analysis above. Please address the issues mentioned in the comments before re-submitting." \
            --repo ${{ github.repository }}

      - name: Fail workflow if slop detected
        if: steps.slop_gate.outcome == 'failure'
        run: exit 1