stages:
  - test

.slop_gate_base:
  image:
    name: ghcr.io/sergudo/ai-slop-gate:latest
    entrypoint: [""]
  variables:
    SLOP_PATH: $CI_PROJECT_DIR
  script:
    - |
      echo "================ DEBUG ENVIRONMENT ================"
      echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
      echo "CI_PROJECT_PATH: $CI_PROJECT_PATH"
      echo "CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID"
      echo "CI_COMMIT_SHA: $CI_COMMIT_SHA"
      echo "CI_JOB_TOKEN (exists?): $( [ -n "$CI_JOB_TOKEN" ] && echo YES || echo NO )"
      echo "GITLAB_API_TOKEN (exists?): $( [ -n "$GITLAB_API_TOKEN" ] && echo YES || echo NO )"
      echo "===================================================="

      echo "--- AI SLOP GATE STARTING ---"

      if [ -z "$SELECTED_POLICY" ]; then
        [ -f "policy.yml" ] && POLICY_PATH="policy.yml" || POLICY_PATH="/app/policy.yml"
      else
        POLICY_PATH="$SELECTED_POLICY"
      fi

      ARGS=""
      PROVIDERS_LIST=${SLOP_PROVIDERS:-"static"}

      for p in $PROVIDERS_LIST; do
        ARGS="$ARGS --provider $p"
      done

      if [[ "$PROVIDERS_LIST" == *"gemini"* || "$PROVIDERS_LIST" == *"groq"* ]]; then
        ARGS="$ARGS --llm-local"
      fi

      echo "DEBUG: Providers: $PROVIDERS_LIST"
      echo "DEBUG: Policy: $POLICY_PATH"

      # Detect MR mode
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        echo "🔍 Detected Merge Request pipeline"
        echo "   Project: $CI_PROJECT_PATH"
        echo "   MR IID: $CI_MERGE_REQUEST_IID"

        ARGS="$ARGS --gitlab-project $CI_PROJECT_PATH --mr-iid $CI_MERGE_REQUEST_IID"

        export GITLAB_API_TOKEN="$CI_JOB_TOKEN"
        echo "DEBUG: GitLab token exported"
      else
        echo "ℹ️ Not a Merge Request pipeline"
      fi

      echo "DEBUG: Final ARGS: $ARGS"

      # Run gate
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        echo "🔍 Running in GitLab MR mode"
        ai-slop-gate run $ARGS --policy "$POLICY_PATH" || true
      else
        echo "ℹ️ Running in local path mode (GitLab MR disabled)"
        echo "DEBUG: Using --path=$SLOP_PATH"
        ai-slop-gate run --path "$SLOP_PATH" $ARGS --policy "$POLICY_PATH" || true
      fi

      echo "--- AI SLOP GATE FINISHED ---"

      echo "================ DEBUG ENVIRONMENT ================"
      echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
      echo "CI_PROJECT_PATH: $CI_PROJECT_PATH"
      echo "CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID"
      echo "CI_COMMIT_SHA: $CI_COMMIT_SHA"
      echo "CI_JOB_TOKEN (exists?): $( [ -n "$CI_JOB_TOKEN" ] && echo YES || echo NO )"
      echo "GITLAB_API_TOKEN (exists?): $( [ -n "$GITLAB_API_TOKEN" ] && echo YES || echo NO )"
      echo "===================================================="