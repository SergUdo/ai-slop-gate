.slop_gate_base:
  image: 
    name: ghcr.io/sergudo/ai-slop-gate:latest
    entrypoint: [""] 
  variables:
    SLOP_PATH: $CI_PROJECT_DIR
    SLOP_PROVIDERS: "static"
  script:
    - |
      echo "--- AI SLOP GATE STARTING ---"
      
      if [ -z "$SELECTED_POLICY" ]; then
        if [ -f "policy.yml" ]; then
          POLICY_PATH="policy.yml"
        else
          POLICY_PATH="/app/policy.yml"
        fi
      else
        POLICY_PATH="$SELECTED_POLICY"
      fi

      ARGS="" 
      IS_LLM=false

      for p in $SLOP_PROVIDERS; do 
        ARGS="$ARGS --provider $p"
        if [[ "$p" == "gemini" || "$p" == "groq" ]]; then
          IS_LLM=true
        fi
      done
      
      if [ "$IS_LLM" = true ]; then
        ARGS="$ARGS --llm-local"
      fi

      echo "DEBUG: Running with providers: $SLOP_PROVIDERS"
      ai-slop-gate run --path "$SLOP_PATH" $ARGS --policy "$POLICY_PATH"

ai_slop_gate_run:
  extends: .slop_gate_base
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"