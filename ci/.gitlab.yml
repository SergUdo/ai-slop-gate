stages:
  - ai_slop_gate_static
  - ai_slop_gate_llm
  - ai_slop_gate_full

variables:
  DOCKER_IMAGE: "ghcr.io/sergiudo/ai-slop-gate:latest"
  WORKSPACE: "/workspace"

ai_slop_gate_static:
  stage: ai_slop_gate_static
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --provider static \
          --fail-on blocking
  allow_failure: false

ai_slop_gate_llm:
  stage: ai_slop_gate_llm
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm \
        -e GEMINI_API_KEY="$GEMINI_API_KEY" \
        -e SLOPE_GATE_GROQ="$SLOPE_GATE_GROQ" \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --provider groq \
          --provider gemini \
          --fail-on blocking
  rules:
    - if: '$GEMINI_API_KEY || $SLOPE_GATE_GROQ'
      when: on_success
    - when: never
  allow_failure: false

ai_slop_gate_full:
  stage: ai_slop_gate_full
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm \
        -e GEMINI_API_KEY="$GEMINI_API_KEY" \
        -e SLOPE_GATE_GROQ="$SLOPE_GATE_GROQ" \
        -v "$CI_PROJECT_DIR:$WORKSPACE" \
        "$DOCKER_IMAGE" \
        run \
          --path "$WORKSPACE" \
          --provider static \
          --provider groq \
          --provider gemini \
          --provider compliance \
          --fail-on blocking
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  allow_failure: false
